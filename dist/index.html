份，是宾语补足语。`},{q:`「鸟会飞」最自然的英语是？`,options:[`Birds can fly.`,`Birds fly.`,`Birds is fly.`,`Fly birds.`],answer:1,explain:`一般现在时即可表示普遍事实，不需要加 can。`},{q:`哪个句子缺少动词？`,options:[`I am tired.`,`He runs fast.`,`My father a doctor.`,`We are happy.`],answer:2,explain:`My father a doctor 缺 be 动词，应为 My father is a doctor.`},{q:`英语语序通常的排列是？`,options:[`谓语 + 主语 + 宾语`,`主语 + 谓语 + 宾语`,`宾语 + 主语 + 谓语`,`随意排列`],answer:1,explain:`英语靠固定位置表意：主语在前，谓语居中。`}],videos:[`is7vn5URVcc`]},{id:`g-2`,no:2,title:`be 动词与「存在」`,thinking:`英语对「是什么状态」和「做什么动作」分得很清楚：状态用 be 动词，动作用实义动词。中文一个「是」可以省，英语的 be 动词不能省，而且要跟着主语变形（am / is / are / was / were）——这是英语「形式必须标记」的典型例子。`,rules:[{formula:`I → am / He·She·It·单数 → is / You·We·They·复数 → are`,desc:`现在时 be 动词的搭配`},{formula:`I·He·She·It·单数 → was / You·We·They·复数 → were`,desc:`过去时 be 动词`},{formula:`There is + 单数/不可数；There are + 复数`,desc:`「有」的存在句型，be 跟着最近的名词走`}],examples:[{en:`I am a student.`,zh:`我是学生。`,ok:!0},{en:`I a student.`,zh:`✗ 缺 be 动词`,ok:!1},{en:`There are two books on the desk.`,zh:`桌上有两本书。`,ok:!0},{en:`There is two books on the desk.`,zh:`✗ 复数要用 are`,ok:!1}],mistakes:[`把 be 动词和实义动词混用：I am go to school. ✗ → I go to school. ✓`,`There be 与 have 混用：「桌上有本书」不用 The desk has a book，常用 There is a book on the desk`,`否定和疑问忘了 be：He not happy ✗ → He is not happy ✓`],questions:[{q:`I ___ a teacher.`,options:[`is`,`am`,`are`,`be`],answer:1,explain:`第一人称单数用 am。`},{q:`There ___ some milk in the cup.`,options:[`is`,`are`,`be`,`have`],answer:0,explain:`milk 不可数，用 is。`},{q:`They ___ at home yesterday.`,options:[`was`,`were`,`are`,`is`],answer:1,explain:`过去时复数用 were。`},{q:`选出正确的否定句`,options:[`He not is happy.`,`He is not happy.`,`He not happy.`,`He doesn't happy.`],answer:1,explain:`be 动词的否定直接加 not 在 be 后面。`},{q:`「桌上有一本书和两支笔」应选？`,options:[`There are a book and two pens.`,`There is a book and two pens.`,`There have a book and two pens.`,`There be a book and two pens.`],answer:1,explain:`就近原则：离 be 最近的是 a book（单数），用 is。`},{q:`哪句语法错误？`,options:[`I am happy.`,`She is my sister.`,`We are students.`,`You is kind.`],answer:3,explain:`You 后面要用 are：You are kind.`}],videos:[`is7vn5URVcc`]},{id:`g-3`,no:3,title:`名词与可数性`,thinking:`英语对名词有一道中文没有的强制关卡：这个词能不能数？能数就得区分单复数，不能数就不能加 a/an 也不能加 -s。中文说「information」和「book」感觉差不多，英语里 information 永远不加 -s，book 不加 -s 就一定是单数——这就是「形式必须明确」的思维。`,rules:[{formula:`可数名词单数前必须有限定词：a / an / the / my / this`,desc:`不能裸奔：I have book ✗ → I have a book ✓`},{formula:`可数名词复数加 -s / -es（city → cities, box → boxes）`,desc:`不规则：man → men, child → children, foot → feet`},{formula:`不可数名词不加 -s，用 much / a lot of 修饰`,desc:`information, advice, furniture, water, money, news`}],examples:[{en:`I need some information.`,zh:`我需要一些信息。`,ok:!0},{en:`I need some informations.`,zh:`✗ information 不可数`,ok:!1},{en:`He gave me two pieces of advice.`,zh:`他给了我两条建议。（不可数用「量词 + of」）`,ok:!0},{en:`He gave me two advices.`,zh:`✗ advice 不可数`,ok:!1}],mistakes:[`不可数名词加 -s：informations / advices / furnitures / equipments 都是错的`,`可数名词单数裸奔：I bought car ✗ → I bought a car ✓`,`把 news、money 当复数：news 是单数概念（The news is good）`],questions:[{q:`一名词复数形式错误的是？`,options:[`boxes`,`cities`,`mans`,`children`],answer:2,explain:`man 的复数是 men。`},{q:`I need ___ advice.`,options:[`a`,`an`,`some`,`many`],answer:2,explain:`advice 不可数，用 some 修饰。`},{q:`哪句正确？`,options:[`She gave me two informations.`,`She gave me two pieces of information.`,`She gave me two information.`,`She gave me an information.`],answer:1,explain:`不可数名词用「数词 + 量词 + of + 名词」。`},{q:`「我有三本书」`,options:[`I have three book.`,`I have three books.`,`I have three of book.`,`I have book three.`],answer:1,explain:`可数名词复数要加 -s。`},{q:`哪个词是不可数名词？`,options:[`apple`,`student`,`furniture`,`city`],answer:2,explain:`furniture（家具）不可数，不说 furnitures。`},{q:`The news ___ good today.`,options:[`are`,`is`,`were`,`be`],answer:1,explain:`news 形式是复数，但作单数用，配 is。`}],videos:[`is7vn5URVcc`]},{id:`g-4`,no:4,title:`冠词 a / an / the`,thinking:`中文没有冠词，所以这是中国人最容易漏的一环。英语在名词前必须回答一个问题：听话人知道我说的是哪一个吗？不知道 → a/an（泛指）；知道 → the（特指）。不是「规则多」，而是英语要求你每次说名词都表明「确定还是不确定」。`,rules:[{formula:`a + 辅音音素开头；an + 元音音素开头`,desc:`看读音不看字母：an hour（h 不发音）, a university（读 /juː/）`},{formula:`the = 双方都知道的那个`,desc:`第二次提到、独一无二、最高级、方位、乐器前常用 the`},{formula:`零冠词：泛指复数 / 不可数 / 三餐 / 球类 / 学科`,desc:`I like apples. / play football / have breakfast`}],examples:[{en:`I saw a dog. The dog was big.`,zh:`我看到一只狗。那只狗很大。（第二次提到用 the）`,ok:!0},{en:`I saw dog. Dog was big.`,zh:`✗ 名词前缺冠词`,ok:!1},{en:`The sun rises in the east.`,zh:`太阳从东边升起。（独一无二 + 方位用 the）`,ok:!0},{en:`Sun rises in east.`,zh:`✗ 漏 the`,ok:!1}],mistakes:[`该用 the 的地方用 a：the tallest boy（最高级前必须 the）`,`球类/三餐前多加 the：play the football ✗ / have the breakfast ✗`,`an 用错：an university ✗（读音是 /juː/ 辅音开头，用 a）`],questions:[{q:`He is ___ honest boy.`,options:[`a`,`an`,`the`,`不填`],answer:1,explain:`honest 的 h 不发音，读音以元音开头 → an。`},{q:`She is ___ tallest girl in our class.`,options:[`a`,`an`,`the`,`不填`],answer:2,explain:`最高级前用 the。`},{q:`I play ___ basketball after school.`,options:[`a`,`an`,`the`,`不填`],answer:3,explain:`球类运动前不加冠词。`},{q:`He is ___ university student.`,options:[`a`,`an`,`the`,`不填`],answer:0,explain:`university 读 /ˌjuːnɪˈvɜːsəti/，以辅音音素 /j/ 开头，用 a。`},{q:`There is ___ hour left.`,options:[`a`,`an`,`the`,`不填`],answer:1,explain:`hour 的 h 不发音，元音开头用 an。`},{q:`第一次提到、对方不知道是哪一个，应该用？`,options:[`the`,`a / an`,`不填`,`this`],answer:1,explain:`泛指（对方不知道是哪一个）用 a/an。`}],videos:[`bYGVys2RdlY`,`7TjOxnsvupE`,`bgaRN0iPPdA`]},{id:`g-5`,no:5,title:`代词：避免重复的手段`,thinking:`英语不喜欢重复名词，所以第二次提到就用代词，并且代词的「格」要跟着它在句中的位置变：作主语用 I，作宾语用 me，表所属用 my/mine。中文「我的」一个词管到底，英语要分 my（后面接名词）和 mine（独立使用）。`,rules:[{formula:`主格：I / you / he / she / it / we / they（作主语）`,desc:`She likes music.`},{formula:`宾格：me / you / him / her / it / us / them（动词或介词后）`,desc:`Give it to me.`},{formula:`形容词性物主代词 + 名词；名词性物主代词独立用`,desc:`my book = mine；This is my book. / This book is mine.`}],examples:[{en:`This is my book. It is mine.`,zh:`这是我的书，它是我的。`,ok:!0},{en:`This is mine book.`,zh:`✗ mine 后面不能接名词`,ok:!1},{en:`Between you and me, he is wrong.`,zh:`私下说，他错了。（介词后用宾格 me）`,ok:!0},{en:`Between you and I, he is wrong.`,zh:`✗ 介词后要用宾格`,ok:!1}],mistakes:[`介词后用主格：with he ✗ → with him ✓`,`my 和 mine 混用`,`its 与 it's 混淆：its 是「它的」，it's = it is`],questions:[{q:`This book is ___.`,options:[`my`,`mine`,`me`,`I`],answer:1,explain:`独立使用要用名词性物主代词 mine。`},{q:`Give the pen to ___.`,options:[`I`,`me`,`my`,`mine`],answer:1,explain:`介词 to 后面用宾格 me。`},{q:`___ is my best friend.`,options:[`Her`,`She`,`Hers`,`Herself`],answer:1,explain:`作主语用主格 She。`},{q:`The cat is washing ___ face.`,options:[`it`,`it's`,`its`,`itself`],answer:2,explain:`its = 它的，后接名词。`},{q:`We often help ___.`,options:[`each other`,`each others`,`one other`,`each another`],answer:0,explain:`相互代词 each other 固定搭配。`},{q:`哪句错误？`,options:[`I like her.`,`He gave me a gift.`,`This is mine pen.`,`They are our friends.`],answer:2,explain:`mine 后面不能接名词，应为 my pen。`}],videos:[`is7vn5URVcc`]},{id:`g-6`,no:6,title:`一般现在时：事实与习惯`,thinking:`英语把「时间」编码进动词形态，这是和中文最大的差别之一。中文说「他每天跑步」，靠「每天」表时间；英语说 He runs every day，即使去掉 every day，runs 这个 -s 也在告诉对方「这是习惯/常态」。换句话说：英语的时间信息，一半藏在动词里。`,rules:[{formula:`主语 + 动词原形（I / you / we / they / 复数）`,desc:`They play football.`},{formula:`主语（he / she / it / 单数）+ 动词 -s / -es`,desc:`She plays. / He watches. / She studies.`},{formula:`否定：don't / doesn't + 动词原形；疑问：Do / Does + 主语 + 动词原形`,desc:`She doesn't like coffee. / Does he play?`}],examples:[{en:`He goes to school by bus.`,zh:`他坐公交上学。（三单加 -es）`,ok:!0},{en:`He go to school by bus.`,zh:`✗ 三单漏 -es`,ok:!1},{en:`Does she like music?`,zh:`她喜欢音乐吗？（Does 后面的动词还原）`,ok:!0},{en:`Does she likes music?`,zh:`✗ Does 后面动词不能再加 -s`,ok:!1}],mistakes:[`三单忘记加 -s / -es`,`Does 后面动词重复加 -s`,`否定句里加 -s：She doesn't likes ✗`],questions:[{q:`My mother ___ TV in the evening.`,options:[`watch`,`watches`,`watching`,`watched`],answer:1,explain:`三单加 -es（watch → watches）。`},{q:`___ your father work in a hospital?`,options:[`Do`,`Does`,`Is`,`Are`],answer:1,explain:`主语 your father 是三单，用 Does。`},{q:`She ___ like coffee.`,options:[`don't`,`doesn't`,`isn't`,`not`],answer:1,explain:`三单否定用 doesn't + 动词原形。`},{q:`Water ___ at 100°C.`,options:[`boil`,`boils`,`boiling`,`boiled`],answer:1,explain:`客观事实用一般现在时，三单加 -s。`},{q:`They ___ English every morning.`,options:[`reads`,`read`,`reading`,`is read`],answer:1,explain:`主语 They 是复数，用动词原形。`},{q:`哪句正确？`,options:[`Does he goes to school?`,`Does he go to school?`,`Do he go to school?`,`Does he going to school?`],answer:1,explain:`Does 后面动词必须用原形。`}],videos:[`P5FrIGgyNSc`,`is7vn5URVcc`]}]},{units:[{id:`g-7`,no:7,title:`进行时：正在发生`,thinking:`英语用 be + doing 这个「双层结构」表示「此刻正在」，形式上等于给动作加了一个「进行中」的标签。中文靠「在/正在」这个副词，英语则必须同时出现 be 动词和 -ing —— 少一个都不对，这就是「形式完整」的思维。`,rules:[{formula:`am / is / are + doing`,desc:`现在进行时：I am reading.`},{formula:`was / were + doing`,desc:`过去进行时：He was sleeping at 8 last night.`},{formula:`状态动词（know / like / belong）一般不用进行时`,desc:`I know the answer. ✓ / I am knowing ✗`}],examples:[{en:`She is reading a book.`,zh:`她正在看书。`,ok:!0},{en:`She reading a book.`,zh:`✗ 漏 be 动词`,ok:!1},{en:`I was watching TV when he called.`,zh:`他打电话时我正在看电视。（过去进行 + 打断）`,ok:!0},{en:`I watching TV when he called.`,zh:`✗ 漏 was`,ok:!1}],mistakes:[`漏 be 动词：He running ✗`,`状态动词用进行时：I am knowing / I am liking ✗`,`把进行时当成「现在时」用：习惯性动作用一般现在时（I read every day，不是 I am reading every day）`],questions:[{q:`Look! The baby ___ .`,options:[`cries`,`is crying`,`cry`,`cried`],answer:1,explain:`Look! 提示此刻正在发生，用进行时。`},{q:`They ___ football at 5 yesterday.`,options:[`played`,`were playing`,`play`,`are playing`],answer:1,explain:`过去某时刻正在进行 → 过去进行时。`},{q:`哪句正确？`,options:[`I am knowing him.`,`I know him.`,`I am know him.`,`I knowing him.`],answer:1,explain:`know 是状态动词，不用进行时。`},{q:`She ___ dinner now.`,options:[`cooks`,`is cooking`,`cook`,`cooked`],answer:1,explain:`now 提示进行时。`},{q:`进行时的公式是？`,options:[`do + doing`,`be + doing`,`have + done`,`will + do`],answer:1,explain:`be 动词 + 现在分词。`},{q:`「他每天跑步」应译为？`,options:[`He is running every day.`,`He runs every day.`,`He run every day.`,`He was running every day.`],answer:1,explain:`习惯性动作（every day）用一般现在时。`}],videos:[`4-hhyv2uyl8`,`P5FrIGgyNSc`]},{id:`g-8`,no:8,title:`过去时：已经结束`,thinking:`英语讲过去的事情时，动词本身必须变形（work → worked，go → went），或者用 did 结构。中文靠「了/过」这类虚词，动词本身不变；英语则要求动词自己「带伤上阵」——形式变了，时间才清楚。`,rules:[{formula:`规则动词 + -ed；不规则动词单独记（go → went, see → saw）`,desc:`I worked. / I went.`},{formula:`否定 / 疑问：didn't / Did + 动词原形`,desc:`I didn't go. / Did you go?`},{formula:`过去时强调「过去某个时间点完成」，常配 yesterday / last week / in 2020`,desc:`与现在完成时区分：过去时有明确过去时间`}],examples:[{en:`I visited my grandma last week.`,zh:`我上周去看外婆了。`,ok:!0},{en:`I visit my grandma last week.`,zh:`✗ 有过去时间就该用过去时`,ok:!1},{en:`Did you finish your homework?`,zh:`你作业做完了吗？（Did 后动词还原）`,ok:!0},{en:`Did you finished your homework?`,zh:`✗ Did 后面不能再用过去式`,ok:!1}],mistakes:[`did 后面又用过去式：did went ✗`,`不规则动词硬加 -ed：goed / eated ✗`,`过去时与现在完成时混用：I have seen him yesterday ✗（yesterday 要用 saw）`],questions:[{q:`I ___ to the zoo yesterday.`,options:[`go`,`went`,`gone`,`going`],answer:1,explain:`yesterday 提示过去时，go 的过去式是 went。`},{q:`___ you see him last night?`,options:[`Do`,`Did`,`Have`,`Are`],answer:1,explain:`过去时疑问用 Did + 原形。`},{q:`She ___ her keys this morning.`,options:[`loses`,`lost`,`losing`,`has lost`],answer:1,explain:`this morning 是明确的过去时间，用过去式 lost。`},{q:`哪句正确？`,options:[`He didn't went there.`,`He didn't go there.`,`He not went there.`,`He doesn't went there.`],answer:1,explain:`didn't 后面用动词原形。`},{q:`「我昨天看了那部电影」`,options:[`I have seen that movie yesterday.`,`I saw that movie yesterday.`,`I see that movie yesterday.`,`I was see that movie yesterday.`],answer:1,explain:`有明确过去时间（yesterday）只能用一般过去时。`},{q:`eat 的过去式是？`,options:[`eated`,`ate`,`eaten`,`eating`],answer:1,explain:`eat → ate → eaten。`}],videos:[`P5FrIGgyNSc`]},{id:`g-9`,no:9,title:`完成时：过去的动作，现在的影响`,thinking:`完成时是中国人最别扭的时态，因为它表达的是一种中文没有的视角：不关心「什么时候做的」，只关心「做到了、有影响」。I have lost my key 的重点不是「过去某个时间丢的」，而是「现在没钥匙、进不去门」。抓住这个「过去 → 现在」的联系，就抓住完成时了。`,rules:[{formula:`have / has + 过去分词`,desc:`I have finished. / She has gone.`},{formula:`不能与明确过去时间连用（yesterday / last week / in 2020）`,desc:`I have seen him yesterday ✗`},{formula:`常配 already / yet / just / ever / never / since / for`,desc:`I have lived here for ten years.`}],examples:[{en:`I have lost my key, so I can't get in.`,zh:`我钥匙丢了，所以进不去。（强调现在的结果）`,ok:!0},{en:`I lost my key yesterday.`,zh:`我昨天丢了钥匙。（只说过去事实，用过去时）`,ok:!0},{en:`I have lost my key yesterday.`,zh:`✗ 完成时不能配明确过去时间`,ok:!1},{en:`She has been to Japan.`,zh:`她去过日本。（有过这个经历）`,ok:!0}],mistakes:[`完成时 + yesterday 等明确过去时间`,`have 后面用过去式而不是过去分词：I have went ✗ → I have gone ✓`,`have been to（去过）与 have gone to（去了还没回）混用`],questions:[{q:`I ___ already ___ my homework.`,options:[`have / finished`,`have / finish`,`has / finished`,`am / finished`],answer:0,explain:`have + 过去分词；主语 I 用 have。`},{q:`She ___ in Beijing for five years.`,options:[`lives`,`lived`,`has lived`,`is living`],answer:2,explain:`for + 时间段，从过去持续到现在，用现在完成时。`},{q:`哪句错误？`,options:[`I have seen this film.`,`He has just left.`,`They have arrived yesterday.`,`We have known each other for years.`],answer:2,explain:`yesterday 是明确过去时间，不能与完成时连用。`},{q:`「你去过日本吗？」`,options:[`Have you been to Japan?`,`Have you gone to Japan?`,`Did you have been to Japan?`,`Are you been to Japan?`],answer:0,explain:`have been to 表示「去过（有经历）」。`},{q:`Tom 不在这儿，他去了图书馆（还没回来）`,options:[`Tom has been to the library.`,`Tom has gone to the library.`,`Tom went to the library.`,`Tom is going to the library.`],answer:1,explain:`have gone to = 去了（人不在这里）。`},{q:`完成时的公式是？`,options:[`be + doing`,`have / has + 过去分词`,`did + 原形`,`will + 原形`],answer:1,explain:`have/has + 过去分词。`}],videos:[`P5FrIGgyNSc`,`4-hhyv2uyl8`]},{id:`g-10`,no:10,title:`将来表达：will 与 be going to`,thinking:`英语表达将来有两条路：will 表示「此刻决定/预测」，be going to 表示「已经打算好/有迹象」。中文一句「我明天去」两种意思都能装，英语却逼你区分：是刚决定的（I'll go），还是早就计划好的（I'm going to go）？这就是英语对「意图来源」的敏感。`,rules:[{formula:`will + 动词原形`,desc:`即时决定、预测、承诺：I will help you.`},{formula:`am / is / are going to + 动词原形`,desc:`已有计划或明显迹象：It's going to rain.`},{formula:`现在进行时也可表近期确定安排`,desc:`I'm meeting him tomorrow.（已约好）`}],examples:[{en:`I'm going to study abroad next year.`,zh:`我打算明年出国留学。（早已计划）`,ok:!0},{en:`The phone is ringing — I'll answer it.`,zh:`电话响了，我去接。（当场决定用 will）`,ok:!0},{en:`I will study abroad next year (already planned).`,zh:`△ 语法没错，但不如 be going to 自然（已计划的事）`,ok:!1},{en:`He will going to school tomorrow.`,zh:`✗ will 与 going to 不能叠用`,ok:!1}],mistakes:[`will 后面加 to：I will to go ✗`,`will 与 be going to 叠用`,`时间状语从句用将来时：「他来了我就走」应说 When he comes, I will leave.（从句用现在时）`],questions:[{q:`Look at those clouds! It ___ rain.`,options:[`will`,`is going to`,`would`,`shall`],answer:1,explain:`有明显迹象（乌云）用 be going to。`},{q:`The phone is ringing. I ___ it.`,options:[`am going to answer`,`will answer`,`answer`,`answered`],answer:1,explain:`当场决定用 will。`},{q:`When he ___ , I will tell him.`,options:[`will come`,`comes`,`came`,`is coming`],answer:1,explain:`时间状语从句用一般现在时表将来。`},{q:`哪句错误？`,options:[`I will call you tonight.`,`She is going to visit us.`,`He will to come tomorrow.`,`They are going to move.`],answer:2,explain:`will 后面直接跟动词原形，不加 to。`},{q:`「我们下周开个会（已经定好）」最自然的是？`,options:[`We will have a meeting next week.`,`We are going to have a meeting next week.`,`We have a meeting next week.`,`We had a meeting next week.`],answer:1,explain:`已计划好的安排用 be going to。`},{q:`shall 在现代英语中主要用于？`,options:[`所有人称的将来`,`第一人称疑问/建议（Shall we go?）`,`过去将来`,`被动语态`],answer:1,explain:`shall 现在多用于 Shall I / Shall we 的建议或征询。`}],videos:[`4-hhyv2uyl8`]},{id:`g-11`,no:11,title:`情态动词：态度与语气`,thinking:`情态动词是英语的「语气旋钮」：can 表能力、may 表可能/许可、must 表必须、should 表建议。它们有一条铁律——后面永远跟动词原形，而且不随人称变化（不加 -s、不加 to）。掌握这组词，你的英语马上从「陈述事实」升级到「表达态度」。`,rules:[{formula:`情态动词 + 动词原形（不加 to、不加 -s）`,desc:`He can swim. ✓ / He cans swim ✗ / He can to swim ✗`},{formula:`can（能力/许可）· may（可能/许可）· must（必须/推测）· should（应该）`,desc:`You should rest. / It may rain.`},{formula:`否定与疑问不加 do：can't / Can you…?`,desc:`You mustn't smoke here. / Can I help you?`}],examples:[{en:`You should see a doctor.`,zh:`你应该去看医生。（建议）`,ok:!0},{en:`You should to see a doctor.`,zh:`✗ should 后不加 to`,ok:!1},{en:`It may rain tomorrow.`,zh:`明天可能下雨。（推测）`,ok:!0},{en:`He cans speak English.`,zh:`✗ 情态动词不加 -s`,ok:!1}],mistakes:[`情态动词后加 to：must to go ✗`,`情态动词加 -s：He musts ✗`,`must 与 have to 混用（must 偏主观「必须」，have to 偏客观「不得不」）`],questions:[{q:`You ___ smoke here. It's not allowed.`,options:[`mustn't`,`needn't`,`shouldn't have`,`don't have to`],answer:0,explain:`禁止用 mustn't。`},{q:`___ you swim when you were five?`,options:[`Can`,`Could`,`Must`,`Should`],answer:1,explain:`过去的能力用 could。`},{q:`哪句正确？`,options:[`He can to drive.`,`He can drives.`,`He can drive.`,`He cans drive.`],answer:2,explain:`情态动词 + 动词原形。`},{q:`It's late. You ___ go home now.`,options:[`should`,`can`,`may`,`would`],answer:0,explain:`表达建议用 should。`},{q:`「你不必来」应译为？`,options:[`You mustn't come.`,`You don't have to come.`,`You can't come.`,`You shouldn't come.`],answer:1,explain:`「不必」用 don't have to；mustn't 是「禁止」。`},{q:`must 表示推测时，通常用于？`,options:[`否定句`,`肯定句（He must be tired）`,`疑问句`,`感叹句`],answer:1,explain:`must 表推测多用于肯定句；否定推测用 can't。`}],videos:[`is7vn5URVcc`]},{id:`g-12`,no:12,title:`介词：in / on / at 与空间时间`,thinking:`介词是英语的「关系词」：它把两个名词的关系说清楚，而且英语对关系的划分比中文细得多。同样是「在」，at 说的是一个点、on 说的是一个面/接触、in 说的是一个范围。时间上也一样：at 8 o'clock（点）、on Monday（天）、in July（月/年）。记住「点 → 面 → 范围」这条轴，介词就不再靠死背。`,rules:[{formula:`空间：at（点）< on（面/接触）< in（范围/内部）`,desc:`at the bus stop / on the wall / in the box`},{formula:`时间：at（钟点）· on（具体某天）· in（月/年/季节/上午下午）`,desc:`at 7:00 / on Monday / in June, in 2020`},{formula:`固定搭配要整体记：be good at, interested in, depend on`,desc:`不要用中文逻辑硬翻`}],examples:[{en:`I get up at six in the morning.`,zh:`我早上六点起床。（钟点 at + 时段 in）`,ok:!0},{en:`I get up on six in morning.`,zh:`✗ 钟点用 at，时段要用 in the morning`,ok:!1},{en:`She is good at math.`,zh:`她擅长数学。（固定搭配 be good at）`,ok:!0},{en:`She is good in math.`,zh:`✗ 固定搭配是 be good at`,ok:!1}],mistakes:[`时间介词乱用：on 2020 ✗ → in 2020 ✓`,`固定搭配照中文翻：depend in ✗ → depend on ✓`,`at night 与 in the morning 的搭配要分别记（不是 on night）`],questions:[{q:`He was born ___ 1998.`,options:[`at`,`on`,`in`,`for`],answer:2,explain:`年份用 in。`},{q:`See you ___ Monday morning.`,options:[`at`,`on`,`in`,`for`],answer:1,explain:`具体某天的早上用 on。`},{q:`The book is ___ the desk.`,options:[`in`,`on`,`at`,`to`],answer:1,explain:`接触表面用 on。`},{q:`I'm interested ___ music.`,options:[`on`,`at`,`in`,`for`],answer:2,explain:`固定搭配 be interested in。`},{q:`She goes to bed ___ 10 o'clock.`,options:[`in`,`on`,`at`,`for`],answer:2,explain:`钟点用 at。`},{q:`哪句正确？`,options:[`He is good in English.`,`He is good at English.`,`He is good on English.`,`He is good for English.`],answer:1,explain:`be good at 是固定搭配。`}],videos:[`nDsNbXuvmDg`,`is7vn5URVcc`]}]},{units:[{id:`g-13`,no:13,title:`被动语态：把重点移到「被怎样」`,thinking:`英语用被动不是为了翻译中文的「被」字，而是为了换焦点：当「谁做的」不重要、不知道、或不想说时，就把受事提到主语位置。中文说「这栋楼建于 1990 年」，英语说 The building was built in 1990 —— 重点是楼，不是建造者。抓住「换焦点」这个动机，被动就不再是死记的公式。`,rules:[{formula:`be + 过去分词（+ by 施事）`,desc:`时态体现在 be 上：is done / was done / has been done / will be done`},{formula:`只有及物动词有被动`,desc:`happen / appear / belong 等不及物动词没有被动式`},{formula:`常用场景：过程/规则/客观陈述`,desc:`English is spoken here. / The work must be finished today.`}],examples:[{en:`The bridge was built in 1990.`,zh:`这座桥建于 1990 年。（重点在桥）`,ok:!0},{en:`The bridge built in 1990.`,zh:`✗ 缺 be 动词`,ok:!1},{en:`English is spoken in many countries.`,zh:`很多国家说英语。（规则性陈述用被动）`,ok:!0},{en:`It was happened yesterday.`,zh:`✗ happen 是不及物动词，没有被动`,ok:!1}],mistakes:[`漏 be 动词，只留过去分词`,`给不及物动词加被动：was happened / is appeared ✗`,`be 与过去分词之间插错时态：The work is finished yesterday ✗（应为 was finished）`],questions:[{q:`The letter ___ yesterday.`,options:[`sent`,`was sent`,`is sent`,`sends`],answer:1,explain:`yesterday 是过去时间，被动用 was + 过去分词。`},{q:`哪句正确？`,options:[`The accident was happened last night.`,`The accident happened last night.`,`The accident is happened last night.`,`The accident was happen last night.`],answer:1,explain:`happen 不及物，用主动形式。`},{q:`English ___ all over the world.`,options:[`speaks`,`is spoken`,`speaking`,`spoke`],answer:1,explain:`英语被说，用被动 is spoken。`},{q:`The homework must ___ before Friday.`,options:[`finish`,`be finished`,`finished`,`be finishing`],answer:1,explain:`情态动词后的被动：must be + 过去分词。`},{q:`「这栋楼是 1990 年建的」`,options:[`This building built in 1990.`,`This building was built in 1990.`,`This building is build in 1990.`,`This building has build in 1990.`],answer:1,explain:`过去被动 was built。`},{q:`被动语态的时态变化体现在哪个词上？`,options:[`过去分词`,`be 动词`,`主语`,`by 短语`],answer:1,explain:`be 变动（is/was/has been/will be），过去分词不变。`}],videos:[`C6tNUqQaFIQ`,`DxX_oqcWuO4`]},{id:`g-14`,no:14,title:`非谓语动词：一句话里只能有一个谓语`,thinking:`英语有条铁律：一个句子只能有一个谓语动词。第二个动作怎么办？必须「降级」成非谓语形式——不定式（to do）、动名词（doing）、分词（doing/done）。选哪个，取决于它在句里扮演什么角色：目的/打算用不定式，作主语宾语用动名词，修饰名词用分词。理解「降级」这个逻辑，比背规则表有用得多。`,rules:[{formula:`to do：表目的、打算、将要`,desc:`I want to go. / He came to help.`},{formula:`doing：作主语/宾语，或表主动进行`,desc:`Reading is fun. / I enjoy reading.`},{formula:`done：表被动完成，作定语/状语`,desc:`a broken cup / Given more time, I could do it.`}],examples:[{en:`I want to learn English.`,zh:`我想学英语。（打算用不定式）`,ok:!0},{en:`I want learn English.`,zh:`✗ want 后面必须接 to do`,ok:!1},{en:`Swimming is good for health.`,zh:`游泳有益健康。（动名词作主语）`,ok:!0},{en:`Swim is good for health.`,zh:`✗ 动词原形不能作主语`,ok:!1}],mistakes:[`一个句子里出现两个谓语：I want go ✗ / I am want to go ✗`,`enjoy / finish / mind 后面用 to do（应为 doing）`,`分词逻辑主语不一致：Walking home, the rain started ✗（走路的不是雨）`],questions:[{q:`I enjoy ___ music.`,options:[`listen`,`to listen`,`listening`,`listened`],answer:2,explain:`enjoy 后面接动名词 doing。`},{q:`She came here ___ the truth.`,options:[`know`,`to know`,`knowing`,`known`],answer:1,explain:`表目的用不定式 to do。`},{q:`___ English well is not easy.`,options:[`Learn`,`To learning`,`Learning`,`Learned`],answer:2,explain:`动名词作主语。`},{q:`哪句正确？`,options:[`I want go home.`,`I want to go home.`,`I want going home.`,`I am want go home.`],answer:1,explain:`want + to do。`},{q:`The window ___ by Tom is broken.`,options:[`break`,`breaking`,`broken`,`broke`],answer:2,explain:`被打破的窗户：过去分词作定语表被动。`},{q:`非谓语动词的出现原因是？`,options:[`句子必须有两个谓语`,`一句话只能有一个谓语，其余动作要降级`,`非谓语可以随便用`,`为了句子更长`],answer:1,explain:`一个句子只有一个谓语，其他动词降级为非谓语。`}],videos:[`LhbZ4TAjgUo`,`L6MUMwoRK0A`]},{id:`g-15`,no:15,title:`虚拟语气：与事实相反的假设`,thinking:`虚拟语气的本质只有一句话：用「过去的形态」表达「不是真的」。所以说 If I were you（我现在不是你）、If I had known（当时并不知道）。中文用「要是…就好了 / 如果当时…」来表达，英语则统一用「退一步的时态」——理解了「退一步」，就不必背表格。`,rules:[{formula:`与现在相反：If + 过去式，主句 would/could + 动词原形`,desc:`If I were you, I would take it.`},{formula:`与过去相反：If + had done，主句 would have done`,desc:`If I had studied, I would have passed.`},{formula:`wish / as if 后同样「退一步」`,desc:`I wish I were taller. / He talks as if he knew everything.`}],examples:[{en:`If I were you, I would apologize.`,zh:`如果我是你，我会道歉。（现在不是）`,ok:!0},{en:`If I am you, I will apologize.`,zh:`✗ 与事实相反要用虚拟`,ok:!1},{en:`If I had known, I would have come.`,zh:`要是我早知道，我就来了。（当时不知道）`,ok:!0},{en:`I wish I am taller.`,zh:`✗ wish 后用过去式 were`,ok:!1}],mistakes:[`与现在相反的假设里用 am/is/are 或 will`,`wish 后面忘「退一步」：I wish I can ✗ → I wish I could ✓`,`把虚拟语气与真实条件句混淆（真实条件用一般时态：If it rains, I will stay home.）`],questions:[{q:`If I ___ you, I would take the job.`,options:[`am`,`was`,`were`,`be`],answer:2,explain:`虚拟语气中 be 统一用 were。`},{q:`If I ___ harder, I would have passed.`,options:[`studied`,`had studied`,`study`,`would study`],answer:1,explain:`与过去相反：If + had done。`},{q:`I wish I ___ speak French.`,options:[`can`,`could`,`will`,`am`],answer:1,explain:`wish 后用过去形式表达不可能/愿望。`},{q:`哪句是真实条件句？`,options:[`If I were rich, I would travel.`,`If it rains, I will stay home.`,`If I had time, I would help.`,`I wish I knew.`],answer:1,explain:`真实可能发生的条件用一般现在时 + will。`},{q:`He talks as if he ___ everything.`,options:[`knows`,`knew`,`know`,`has known`],answer:1,explain:`as if + 虚拟，用过去式。`},{q:`虚拟语气的核心逻辑是？`,options:[`用现在时表示礼貌`,`用过去的形态表示与事实相反`,`加 to 就行`,`用 will 表示愿望`],answer:1,explain:`「退一步的时态」= 不是真的。`}],videos:[`-Skm12wNLa8`,`6ZaAcZDku3I`]},{id:`g-16`,no:16,title:`倒装：为了强调而调换语序`,thinking:`英语语序通常是主语在前，但当否定词、only 短语被提到句首时，必须把助动词提到主语前面——这就是倒装。它不是为了好看，而是英语「形式标记焦点」的习惯：把注意力引到前面那个成分上。中文靠「尤其/正是」这类词强调，英语靠换语序。`,rules:[{formula:`否定词提前：Never / Hardly / Not only + 助动词 + 主语`,desc:`Never have I seen such a thing.`},{formula:`only + 状语提前：Only then did I realize…`,desc:`Only in this way can we succeed.`},{formula:`虚拟条件句省略 if 时倒装：Were I you… / Had I known…`,desc:`Had I known, I would have helped.`}],examples:[{en:`Never have I seen such a beautiful place.`,zh:`我从没见过这么美的地方。`,ok:!0},{en:`Never I have seen such a beautiful place.`,zh:`✗ 否定词提前后要倒装`,ok:!1},{en:`Only then did I understand.`,zh:`只有到那时我才明白。`,ok:!0},{en:`Only then I understood.`,zh:`✗ only 状语提前需倒装`,ok:!1}],mistakes:[`否定词提前后忘倒装`,`倒装时漏掉助动词：Never I saw ✗`,`把 only + 主语提前当成倒装（Only he knows. 不倒装，因为 only 修饰主语）`],questions:[{q:`Never ___ such a thing.`,options:[`I have seen`,`have I seen`,`I saw`,`did I saw`],answer:1,explain:`否定词提前：助动词 have 提到主语前。`},{q:`Only in this way ___ improve your English.`,options:[`you can`,`can you`,`you could`,`do you`],answer:1,explain:`only + 方式状语提前，主句倒装。`},{q:`___ I known the truth, I would have told you.`,options:[`If`,`Had`,`Have`,`Did`],answer:1,explain:`虚拟条件省略 if 时用 Had 提前。`},{q:`哪句正确？`,options:[`Hardly I had arrived when it rained.`,`Hardly had I arrived when it rained.`,`Hardly I arrived when it rained.`,`Hardly did I had arrived when it rained.`],answer:1,explain:`Hardly 提前需倒装：Hardly had I arrived…`},{q:`Only he ___ the answer.`,options:[`does know`,`knows`,`know`,`did knows`],answer:1,explain:`only 修饰主语时不倒装，正常语序。`},{q:`倒装的触发条件通常是？`,options:[`任何句子都可以`,`否定词或 only 状语被提到句首`,`主语很长`,`句子是疑问句以外的所有情况`],answer:1,explain:`否定词/only 状语提前是常见触发条件。`}],videos:[`dEIKsJTGby4`,`orJDbK2rGyM`]},{id:`g-17`,no:17,title:`主谓一致：谓语要跟着主语走`,thinking:`英语要求谓语动词在人称和数上与主语一致，这是「形式必须标记」的又一次体现。难点不在简单句，而在主语变长时：True or false? 这类插入语、along with 这类伴随短语、以及集合名词（family/team）到底算单数还是复数。判断方法只有一条：找到真正的核心主语。`,rules:[{formula:`核心主语的单复数决定谓语`,desc:`The list of items is long.（主语是 list，不是 items）`},{formula:`along with / together with / as well as 不改变主语数`,desc:`Tom, along with his friends, is coming.`},{formula:`集合名词视为整体用单数（The team is winning）；强调成员用复数（The team are arguing）`,desc:`英式英语中后者更常见`}],examples:[{en:`The number of students is increasing.`,zh:`学生人数在增加。（主语是 number）`,ok:!0},{en:`The number of students are increasing.`,zh:`✗ 主语是 the number，用 is`,ok:!1},{en:`Either you or he is right.`,zh:`要么你对，要么他对。（就近原则）`,ok:!0},{en:`Either you or he are right.`,zh:`✗ 就近原则取 he → is`,ok:!1}],mistakes:[`被 of 短语误导：The list of items are… ✗`,`each / every / either / neither 作主语时用复数谓语 ✗`,`there be 后有几个名词时忘记就近原则`],questions:[{q:`The list of names ___ on the desk.`,options:[`are`,`is`,`were`,`be`],answer:1,explain:`主语是 the list（单数）。`},{q:`Tom, along with his parents, ___ coming.`,options:[`are`,`is`,`were`,`be`],answer:1,explain:`along with 不改变主语数，主语是 Tom。`},{q:`Each of the students ___ a book.`,options:[`have`,`has`,`are having`,`were having`],answer:1,explain:`each 作主语用单数。`},{q:`There ___ a pen and two books on the desk.`,options:[`are`,`is`,`were`,`be`],answer:1,explain:`就近原则：离 be 最近的是 a pen。`},{q:`Neither of the answers ___ correct.`,options:[`are`,`is`,`were`,`be`],answer:1,explain:`neither 作主语视为单数。`},{q:`判断主谓一致的要点是？`,options:[`看离谓语最近的名词`,`找到真正的核心主语（去掉修饰成分）`,`一律用复数`,`看句子长短`],answer:1,explain:`先去掉 of 短语等修饰，找核心主语。`}],videos:[`0BhEJtrm6ro`,`yYe0OZkWJG4`]}]},{units:[{id:`g-18`,no:18,title:`宾语从句：把一句话当成宾语`,thinking:`英语允许把整个句子「降级」成一个名词，塞进宾语的位置。关键变化有三点：用 that/if/whether/疑问词引导，语序必须回到「主语 + 谓语」（不能像疑问句那样倒装），时态要跟主句保持呼应。中文说「我不知道他在哪」，语序照抄就行；英语却要 I don't know where he is —— 语序被重置了。`,rules:[{formula:`主句 + that / whether(if) / 疑问词 + 陈述语序`,desc:`I think (that) he is right. / I wonder if he will come.`},{formula:`宾语从句一律用陈述语序`,desc:`Do you know where he lives?（不是 where does he live）`},{formula:`主句是过去时 → 从句时态相应后退`,desc:`He said he was busy. / She asked what I wanted.`}],examples:[{en:`I don't know where he is.`,zh:`我不知道他在哪。`,ok:!0},{en:`I don't know where is he.`,zh:`✗ 从句要用陈述语序`,ok:!1},{en:`She asked if I liked coffee.`,zh:`她问我是否喜欢咖啡。`,ok:!0},{en:`She asked if did I like coffee.`,zh:`✗ 从句不倒装`,ok:!1}],mistakes:[`从句里保留疑问语序：where does he live ✗`,`whether 与 if 混用（介词后、句首、or not 前只能用 whether）`,`主句过去时但从句用现在时（时态不呼应）：He said he is busy ✗`],questions:[{q:`Do you know where ___?`,options:[`does he live`,`he lives`,`he live`,`did he live`],answer:1,explain:`宾语从句用陈述语序。`},{q:`She asked me ___ I had finished.`,options:[`that`,`if`,`what`,`which`],answer:1,explain:`「是否」用 if / whether。`},{q:`He said that he ___ tired.`,options:[`is`,`was`,`be`,`were`],answer:1,explain:`主句过去时，从句时态后退：was。`},{q:`哪句正确？`,options:[`I wonder what is he doing.`,`I wonder what he is doing.`,`I wonder what does he do.`,`I wonder what he does doing.`],answer:1,explain:`从句用陈述语序。`},{q:`介词后面表示「是否」只能用？`,options:[`if`,`whether`,`that`,`what`],answer:1,explain:`介词后、or not 前、句首用 whether。`},{q:`宾语从句的语序规则是？`,options:[`疑问语序`,`陈述语序（主语 + 谓语）`,`倒装语序`,`随意`],answer:1,explain:`从句永远是陈述语序。`}],videos:[`6n-HExTrJak`,`PSAq2EJUxXc`]},{id:`g-19`,no:19,title:`定语从句：给名词加一条说明`,thinking:`中文习惯把修饰语放前面（「我昨天买的书」），英语则把长修饰语放到名词后面，用 who/which/that 引出一条从句。这就是「英语喜欢右展开」的思维：主干先说清，补充信息往后挂。理解这一点，就明白为什么英语句子常显得「后面越拖越长」。`,rules:[{formula:`先行词（人）+ who/that；先行词（物）+ which/that`,desc:`The man who called you is my uncle.`},{formula:`关系词在从句中作宾语时可省略`,desc:`The book (that) I bought is good.`},{formula:`非限制性定语从句用逗号隔开，只能用 which/who，不能用 that`,desc:`My father, who is a doctor, works here.`}],examples:[{en:`The book that I bought yesterday is interesting.`,zh:`我昨天买的那本书很有意思。`,ok:!0},{en:`The book I bought it yesterday is interesting.`,zh:`✗ 关系词已作宾语，不能再加 it`,ok:!1},{en:`My mother, who is a teacher, loves reading.`,zh:`我妈妈是老师，她爱读书。（非限制性）`,ok:!0},{en:`My mother, that is a teacher, loves reading.`,zh:`✗ 非限制性从句不能用 that`,ok:!1}],mistakes:[`从句里重复宾语：the book that I bought it ✗`,`该用 which 的地方用 that（非限制性从句）`,`关系词选错：人用 which ✗（应为 who）`],questions:[{q:`The girl ___ is singing is my sister.`,options:[`which`,`who`,`whom`,`whose`],answer:1,explain:`先行词是人且在从句作主语，用 who。`},{q:`This is the house ___ I lived in.`,options:[`who`,`which`,`whose`,`whom`],answer:1,explain:`先行词是物，用 which（也可用 that）。`},{q:`哪句正确？`,options:[`The film that I saw it was good.`,`The film that I saw was good.`,`The film what I saw was good.`,`The film who I saw was good.`],answer:1,explain:`关系词作宾语，从句内不再重复 it。`},{q:`Mr. Li, ___ teaches English, is popular.`,options:[`that`,`who`,`which`,`whose`],answer:1,explain:`非限制性定语从句指人用 who。`},{q:`I know a boy ___ father is a pilot.`,options:[`who`,`whose`,`which`,`whom`],answer:1,explain:`表示所属关系用 whose。`},{q:`英语习惯把长修饰语放在名词的？`,options:[`前面`,`后面`,`中间`,`随意`],answer:1,explain:`英语右展开：修饰语后置。`}],videos:[`tRPDt_V9g3g`,`BsbS8RyklPk`,`6n-HExTrJak`]},{id:`g-20`,no:20,title:`状语从句：说明时间、原因、条件`,thinking:`英语用从句交代「什么时候、为什么、什么条件下」，而且有一条中文没有的规则：**时间/条件状语从句里不能用 will**，要用一般现在时表将来（When he comes, I will tell him）。因为英语认为「从句先发生、主句后发生」，从句不用再标记将来。掌握这条，就抓住了状语从句最容易出错的地方。`,rules:[{formula:`时间：when / while / before / after / as soon as / until`,desc:`As soon as he arrives, we will start.`},{formula:`条件：if / unless / as long as`,desc:`If it rains, we will stay home.`},{formula:`原因/结果：because / since / so … that / such … that`,desc:`He was so tired that he fell asleep.`}],examples:[{en:`When he comes, I will tell him.`,zh:`他来了我就告诉他。（从句用现在时）`,ok:!0},{en:`When he will come, I will tell him.`,zh:`✗ 时间状语从句不用 will`,ok:!1},{en:`Unless you hurry, you will be late.`,zh:`除非你快点，否则会迟到。`,ok:!0},{en:`Because he was ill, so he didn't come.`,zh:`✗ because 与 so 不能同时用`,ok:!1}],mistakes:[`时间/条件状语从句里用 will`,`because 和 so 连用、although 和 but 连用（中文习惯，英语不行）`,`so…that 与 such…that 混用（so + 形容词/副词；such + 名词短语）`],questions:[{q:`I will call you as soon as I ___ home.`,options:[`will get`,`get`,`got`,`am getting`],answer:1,explain:`时间状语从句用一般现在时表将来。`},{q:`___ you study hard, you will pass.`,options:[`If`,`Though`,`Because`,`While`],answer:0,explain:`条件用 if。`},{q:`哪句正确？`,options:[`Although he is rich, but he is unhappy.`,`Although he is rich, he is unhappy.`,`Because he is rich, so he is happy.`,`He is rich, although but unhappy.`],answer:1,explain:`although 不与 but 连用。`},{q:`He was ___ tired that he fell asleep at once.`,options:[`such`,`so`,`very`,`too`],answer:1,explain:`so + 形容词 + that。`},{q:`___ it rains tomorrow, we will cancel the trip.`,options:[`If`,`Because`,`Although`,`So`],answer:0,explain:`条件状语从句。`},{q:`时间状语从句表将来时，谓语用？`,options:[`will + 动词`,`一般现在时`,`过去时`,`现在完成时`],answer:1,explain:`从句用一般现在时，主句用 will。`}],videos:[`pO_yUitwcDo`,`SYatdZPWUIE`]},{id:`g-21`,no:21,title:`名词性从句：主语、表语、同位语`,thinking:`宾语从句你已经会了，其实同一个「句子降级成名词」的机制还能放在主语位置（主语从句）、be 动词后面（表语从句）、名词后面解释内容（同位语从句）。英语对「从句在句中担任什么角色」非常敏感，这就是为什么同一个 that 引导的从句，语法功能却完全不同——判断方法永远是问：它在句里顶替了哪个名词？`,rules:[{formula:`主语从句：What he said / That he lied + 谓语`,desc:`What he said is true. / It is important that you come.`},{formula:`表语从句：be + that / whether / 疑问词从句`,desc:`The problem is that we have no time.`},{formula:`同位语从句：抽象名词（fact / idea / news）+ that 从句解释内容`,desc:`The fact that he lied surprised us.`}],examples:[{en:`What he said is true.`,zh:`他说的是真的。（主语从句）`,ok:!0},{en:`That he said is true.`,zh:`✗ 缺成分，应改为 What he said`,ok:!1},{en:`The problem is that we have no time.`,zh:`问题是我们没有时间。（表语从句）`,ok:!0},{en:`The news that he won made us happy.`,zh:`他获胜的消息让我们很高兴。（同位语从句）`,ok:!0}],mistakes:[`主语从句用 that 时忘记形式主语 it（It is important that…）`,`what 与 that 混用（what = 先行词 + 关系词，本身在从句中作成分）`,`同位语从句与定语从句混淆（同位语从句 that 不作成分，只起连接作用）`],questions:[{q:`___ she said made me angry.`,options:[`That`,`What`,`Which`,`It`],answer:1,explain:`what 在从句中作宾语，等于「她说的（话）」。`},{q:`It is important ___ we protect the environment.`,options:[`what`,`that`,`which`,`if`],answer:1,explain:`It 作形式主语，真正主语是 that 从句。`},{q:`The reason is ___ he was late.`,options:[`because`,`that`,`why`,`what`],answer:1,explain:`表语从句用 that（reason is that…）。`},{q:`The fact ___ she passed the exam surprised us.`,options:[`which`,`that`,`what`,`who`],answer:1,explain:`同位语从句解释 fact 的内容。`},{q:`what 与 that 的关键区别是？`,options:[`没区别`,`what 本身在从句中作成分，that 只连接不作成分`,`that 更长`,`what 只用于疑问句`],answer:1,explain:`what 有实义、作成分；that 只是连接词。`},{q:`哪句正确？`,options:[`That he said is true.`,`What he said is true.`,`Which he said is true.`,`It he said is true.`],answer:1,explain:`从句缺宾语，要用 what。`}],videos:[`RzeNoCXBtXs`,`AXeRHJSi6z8`,`6n-HExTrJak`]},{id:`g-22`,no:22,title:`语篇连接：让句子之间有关系`,thinking:`英语写作的评分点常常不在单句，而在「句子之间有没有逻辑关系」。中文可以靠意合（意思连上就行），英语更依赖显性连接词：转折 however、因果 therefore、递进 moreover、举例 for instance。这一单元的思维是：**让逻辑关系出现在字面上**，而不是让读者猜。`,rules:[{formula:`转折：however / nevertheless / on the contrary`,desc:`放在句首并加逗号：However, the result was different.`},{formula:`因果：therefore / thus / as a result / consequently`,desc:`He was late. Therefore, he missed the train.`},{formula:`递进/补充：moreover / furthermore / in addition / besides`,desc:`Moreover, the cost is too high.`}],examples:[{en:`The task is hard. However, we can finish it.`,zh:`任务很难，但我们可以完成。`,ok:!0},{en:`The task is hard. But however, we can finish it.`,zh:`✗ but 与 however 不能叠用`,ok:!1},{en:`He studied hard. As a result, he passed.`,zh:`他努力学习，结果通过了。`,ok:!0},{en:`He studied hard. As a result of, he passed.`,zh:`✗ as a result of 后面要接名词`,ok:!1}],mistakes:[`but 与 however、because 与 so 同时使用`,`连接副词当连词用（However he was tired. ✗ 需加逗号或用 but）`,`逗号连接两个完整句子（comma splice），应用分号或连接词`],questions:[{q:`He was ill. ___ , he still came to work.`,options:[`Therefore`,`However`,`Moreover`,`For example`],answer:1,explain:`前后是转折关系。`},{q:`It rained heavily. ___ , the match was cancelled.`,options:[`However`,`As a result`,`In addition`,`For instance`],answer:1,explain:`因果关系用 as a result。`},{q:`哪句正确？`,options:[`He is rich. But however he is sad.`,`He is rich. However, he is sad.`,`He is rich, however he is sad.`,`He is rich however, he is sad.`],answer:1,explain:`however 单独使用并加逗号。`},{q:`表示「此外、而且」的是？`,options:[`Moreover`,`Therefore`,`However`,`Otherwise`],answer:0,explain:`moreover 表递进。`},{q:`逗号连接两个完整句子在英语中称为？`,options:[`正确写法`,`comma splice（需改为分号或加连词）`,`强调句式`,`省略句`],answer:1,explain:`这是常见写作错误。`},{q:`英语写作更看重？`,options:[`句子越长越好`,`句间逻辑明确（显性连接）`,`词越难越好`,`避免使用连接词`],answer:1,explain:`英语偏好显性逻辑连接。`}],videos:[`is7vn5URVcc`]},{id:`g-23`,no:23,title:`英语思维专题：信息结构与焦点`,thinking:`把前面 22 个单元串起来看，英语有一条贯穿始终的习惯：**重要的信息放前面，新信息放后面**，并且用形式把它标出来（被动语态换焦点、there be 引出新事物、
